name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/mimascota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: backend
      - run: npx prisma validate
        working-directory: backend
      - run: npm run build
        working-directory: backend
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners include Android SDK and command-line tools.
      # Avoid setup-android action, which was failing before Gradle ran.
      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "SDK location: $SDK"
          test -d "$SDK" || { echo "::error::Android SDK directory not found: $SDK"; exit 1; }
          MANAGER=""
          for candidate in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then MANAGER="$candidate"; break; fi
          done
          if [ -z "$MANAGER" ]; then
            MANAGER="$(find "$SDK/cmdline-tools" -maxdepth 5 -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$MANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK. Available SDK directories:"
            ls -la "$SDK"
            exit 1
          fi
          echo "SDKMANAGER=$MANAGER" >> "$GITHUB_ENV"
          "$MANAGER" --version
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and test Android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace --console=plain
        working-directory: android
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Mascota-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
